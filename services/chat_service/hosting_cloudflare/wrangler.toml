name = "bgmi_chat_service"
main = "index.js"
compatibility_date = "2025-11-11"

[[d1_databases]]
binding = "chat_db"
database_name = "bgmi_chat_db"
database_id = "ce6830fc-d9b7-4977-95e2-47dc51f509e0"

[vars]
SERVICE_NAME = "chat_service"
SERVICE_VERSION = "1.1.1"

# Secrets (set via `wrangler secret put bgmi_chat_service <NAME>`, never commit):
#   JWT_SECRET        – shared signing secret (identical across all workers)
#   ENCRYPTION_SECRET – optional chat message encryption key
