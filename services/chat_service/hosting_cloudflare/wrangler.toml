name = "bgmi_chat_service"
main = "index.js"
compatibility_date = "2025-11-11"

[[d1_databases]]
binding = "CHAT_DB"
database_name = "chat_db"
database_id = "bcbf4bae-bbed-423c-9fb0-1c92ad718062"

[[kv_namespaces]]
binding = "chat_media"
id = "1d512cdec7e748a38789bb4e6df49a37"

[triggers]
crons = ["*/30 * * * *"]

[vars]
SERVICE_NAME = "chat_service"
SERVICE_VERSION = "1.2.0"
GLOBAL_TTL_HOURS = "12"
PRIVATE_TTL_HOURS = "24"
ROOM_TTL_HOURS = "24"

# Secrets (set via `wrangler secret put bgmi_chat_service <NAME>`, never commit):
#   JWT_SECRET        – shared signing secret (identical across all workers)
#   ENCRYPTION_SECRET – optional chat message encryption key
