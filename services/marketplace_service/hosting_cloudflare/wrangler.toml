# =====================================================
# BGMI Marketplace Service (Cloudflare Worker)
# =====================================================
name = "bgmi_marketplace_service"
main = "index.js"
compatibility_date = "2025-11-12"

# =====================================================
# D1 DATABASE BINDING
# =====================================================
[[d1_databases]]
binding = "marketplace_db"
database_name = "bgmi_marketplace_db"
database_id = "71eff31d-c376-4bb5-aa6e-edc2fe5d1afa"

# =====================================================
# CORE SERVICE ENVIRONMENT VARIABLES
# =====================================================
[vars]
SERVICE_NAME = "marketplace_service"
SERVICE_VERSION = "1.1.1"

AUTH_SERVICE_URL   = "https://auth-service.bgmi-gateway.workers.dev/api/auth"
CHAT_SERVICE_URL   = "https://bgmi_chat_service.bgmi-gateway.workers.dev/api"
WALLET_SERVICE_URL = "https://bgmi-marketplace.bgmi-gateway.workers.dev/api"

WALLET_ESCROW_ENABLED = "true"
CHAT_NOTIFICATIONS_ENABLED = "true"

# Secrets (set via `wrangler secret put bgmi_marketplace_service <NAME>`, never commit):
#   JWT_SECRET – shared signing secret (identical across all workers)

# =====================================================
# OBSERVABILITY
# =====================================================
[observability.logs]
enabled = true

# =====================================================
# BUILD CONFIGURATION
# =====================================================
[build]
command = "npm install"

# =====================================================
# ENVIRONMENTS
# =====================================================
[env.local.vars]
ENVIRONMENT = "local"
DEBUG = "true"

[[env.local.d1_databases]]
binding = "marketplace_db"
database_name = "bgmi_marketplace_db"
database_id = "71eff31d-c376-4bb5-aa6e-edc2fe5d1afa"

[env.production.vars]
ENVIRONMENT = "production"
DEBUG = "false"
SERVICE_NAME = "marketplace_service"
SERVICE_VERSION = "1.1.1"

AUTH_SERVICE_URL   = "https://auth-service.bgmi-gateway.workers.dev/api/auth"
CHAT_SERVICE_URL   = "https://bgmi_chat_service.bgmi-gateway.workers.dev/api"
WALLET_SERVICE_URL = "https://bgmi-marketplace.bgmi-gateway.workers.dev/api"

WALLET_ESCROW_ENABLED = "true"
CHAT_NOTIFICATIONS_ENABLED = "true"

[[env.production.d1_databases]]
binding = "marketplace_db"
database_name = "bgmi_marketplace_db"
database_id = "71eff31d-c376-4bb5-aa6e-edc2fe5d1afa"

# =====================================================
# Deploy:  npx wrangler deploy --env production
# Health:  https://bgmi_marketplace_service.bgmi-gateway.workers.dev/api/health
# =====================================================
