name = "auth-service"
main = "index.js"
compatibility_date = "2025-11-08"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "verification_d1"
database_id = "f727a3c3-121e-487b-934b-2c66b1abbf29"

# Secrets (set via `wrangler secret put auth-service <NAME>`, never commit):
#   JWT_SECRET     – shared signing secret (identical across all workers)
#   ADMIN_EMAIL    – admin login email
#   ADMIN_PASSWORD – admin login password
#   BREVO_API_KEY  – Brevo (Sendinblue) API key for OTP emails
