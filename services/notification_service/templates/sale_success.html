
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sale Success</title>
  <style>
    body { font-family: Arial; background-color: #f8f9fa; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 Congratulations {{ username }}!</h2>
    <p>Your BGMI ID <b>{{ item_name }}</b> has been sold successfully.</p>
    <p>Amount credited: ₹{{ price }} (after 2.5% service charge deduction).</p>
    <p>Thank you for using <b>BGMI Market</b>.</p>
  </div>
</body>
</html>
