name = "bgmi-marketplace"
main = "index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "wallet_db"
database_id = "78b0fb6a-3739-41b7-9f8f-8b2309b2299f"

# Verification service base URL (used to resolve a seller's own UPI ID for direct payment)
[vars]
VERIFY_URL = "https://verification_service.bgmi-gateway.workers.dev"

[[services]]
binding = "VERIFICATION_SERVICE"
service = "verification_service"

# Service binding for worker-to-worker calls (plain fetch to *.workers.dev is blocked by
# Cloudflare with error 1042, breaking /pay/service-charge order validation).
[[services]]
binding = "MARKETPLACE"
service = "bgmi_marketplace_service"

# Secrets (set via `wrangler secret put bgmi-marketplace <NAME>`, never commit):
#   JWT_SECRET      – shared JWT signing secret (must match auth-service)
#   ADMIN_UPI_ID    – platform UPI ID used when the seller has no UPI set
#   ADMIN_UPI_NAME  – display name for the platform UPI ID
#   MARKETPLACE_URL – marketplace worker URL (default: bgmi_marketplace_service)
#
# NOTE: the deployed wallet worker name is `bgmi-marketplace`
# (URL: https://bgmi-marketplace.bgmi-gateway.workers.dev).
# The frontend + gateway must use THIS name, not `bgmi-wallet-service`.
