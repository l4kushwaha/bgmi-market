# === Cloudflare Worker Configuration ===
name = "verification_service"
main = "index.js"
compatibility_date = "2025-11-08"

# KV Namespace for uploads
[[kv_namespaces]]
binding = "UPLOADS"
id = "729f93be021741a480285c02a21b531f"

# D1 Database for verification & profile info
[[d1_databases]]
binding = "VERIFICATION_DB"
database_name = "verification_db"
database_id = "0e46dbce-ea45-4252-8128-7346ffb060d7"

[vars]
AUTH_SERVICE_URL = "https://auth-service.bgmi-gateway.workers.dev/api/auth"

# Secrets (set via `wrangler secret put verification_service <NAME>`, never commit):
#   JWT_SECRET – shared signing secret (identical across all workers)
